openapi: 3.1.0
info:
  title: ARB-A · API de carga
  version: 1.0.0
  description: |
    Carga un CSV o un libro de Excel (`.xlsx`), lo guarda y envía por correo un link
    directo a los destinatarios indicados. El link vive 30 días; el archivo se conserva 90.

    El tipo se decide por el **contenido**, no por la extensión: los `.xls` binarios y los
    libros con macros se rechazan.

    Los errores traen un `codigo` estable: el cliente compara ese campo, no el texto.
  contact:
    name: Soporte ARB-A
    email: noreply-arb-a@servicios.care
servers:
  - url: https://arb-a.servicios.care
    description: Producción
security:
  - ApiKey: []
paths:
  /api/upload:
    put:
      operationId: subirCsv
      summary: Sube un CSV o .xlsx y avisa por correo a los destinatarios
      description: |
        El cuerpo es el archivo **crudo** (`Content-Type: text/csv` o el MIME del `.xlsx`),
        sin multipart. El servidor valida el contenido y decide el tipo por la firma del
        archivo: el CSV se comprime en gzip; el `.xlsx` se guarda tal cual.

        La operación **no es idempotente**: un segundo envío del mismo archivo crea otro
        registro y manda otros correos.
      parameters:
        - $ref: "#/components/parameters/ApiKey"
        - $ref: "#/components/parameters/Correos"
        - $ref: "#/components/parameters/Nombre"
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            description: CSV sin comprimir. Máximo 64 MB por defecto (configurable).
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
            description: |
              Libro `.xlsx` (sin macros). Máximo 64 MB por defecto (configurable). Se
              guarda sin recomprimir.
      responses:
        "201":
          description: Archivo guardado y link emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaCreada"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "507":
          description: Cuota de disco de la instancia agotada
          $ref: "#/components/responses/Error"
        "429":
          description: |
            Más de 100 cargas aceptadas desde la misma IP en una hora. Incluye la cabecera
            `Retry-After` con los segundos que faltan para que la ventana se libere.
          headers:
            Retry-After:
              description: Segundos de espera antes de reintentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: subirCsvPost
      summary: Igual que `PUT /api/upload` (alias)
      description: Alias de `PUT`; mismo contrato y mismas respuestas.
      parameters:
        - $ref: "#/components/parameters/ApiKey"
        - $ref: "#/components/parameters/Correos"
        - $ref: "#/components/parameters/Nombre"
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            description: CSV sin comprimir. Máximo 64 MB por defecto (configurable).
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
            description: Libro `.xlsx` (sin macros). Máximo 64 MB por defecto.
      responses:
        "201":
          description: Archivo guardado y link emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaCreada"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "507":
          description: Cuota de disco de la instancia agotada
          $ref: "#/components/responses/Error"
        "429":
          description: |
            Más de 100 cargas aceptadas desde la misma IP en una hora. Incluye la cabecera
            `Retry-After` con los segundos que faltan para que la ventana se libere.
          headers:
            Retry-After:
              description: Segundos de espera antes de reintentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ApiKey:
      name: X-Api-Key
      in: header
      required: true
      description: Clave del servicio. Se compara en tiempo constante.
      schema:
        type: string
    Correos:
      name: X-Correos
      in: header
      required: true
      description: |
        Destinatarios del link, separados por coma o punto y coma. Se normalizan a
        minúsculas y se deduplican. Máximo 50. Es también la regla de acceso del portal:
        un usuario ve el archivo si su correo está aquí.
      schema:
        type: string
      example: uno@comex.care;dos@transportesvata.com
    Nombre:
      name: X-Nombre
      in: header
      required: false
      description: |
        Nombre visible en el portal. Se sanea y se guarda en mayúsculas; la extensión la
        decide el servidor según el tipo detectado. Si falta, se usa `ARCHIVO` con la
        extensión del tipo (`.CSV` o `.XLSX`).
      schema:
        type: string
      example: ventas_marzo
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  responses:
    Error:
      description: Error de validación o de servicio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CargaCreada:
      type: object
      required: [ok, id, nombre, bytes, bytes_gz, sha256, tipo, expira_en, link_expira_en, link, envios]
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [csv, xlsx]
          description: Tipo detectado por el contenido del archivo
        nombre:
          type: string
          description: Nombre visible, en MAYÚSCULAS, con extensión `.CSV` o `.XLSX`
          examples: [VENTAS_MARZO.CSV]
        bytes:
          type: integer
          format: int64
          description: Tamaño del archivo original
        bytes_gz:
          type: integer
          format: int64
          description: |
            Bytes que ocupa en disco: el `.gz` para CSV; el `.xlsx` tal cual (no se
            recomprime).
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 del archivo original (no del `.gz`)
        expira_en:
          type: string
          format: date-time
          description: Vigencia del archivo (90 días).
        link_expira_en:
          type: string
          format: date-time
          description: Vigencia del link del correo (30 días); después solo se llega por el portal.
        link:
          type: string
          format: uri
          description: Link directo con token. Es un secreto.
        csv:
          $ref: "#/components/schemas/CsvResumen"
        xlsx:
          $ref: "#/components/schemas/XlsxResumen"
        envios:
          $ref: "#/components/schemas/Envios"
        aviso:
          type: string
          description: Solo aparece cuando `envios.ok` es 0
    CsvResumen:
      type: object
      description: Presente solo cuando `tipo` es `csv`
      required: [lineas, columnas, separador]
      properties:
        lineas:
          type: integer
          description: Líneas con datos (la primera es el encabezado)
        columnas:
          type: integer
        separador:
          type: string
          enum: [",", ";", "\t", "|"]
    XlsxResumen:
      type: object
      description: Presente solo cuando `tipo` es `xlsx`
      required: [hojas, entradas]
      properties:
        hojas:
          type: integer
          description: Hojas declaradas en el libro
        entradas:
          type: integer
          description: Entradas del ZIP (tope 5000)
    Envios:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: integer
          description: Correos entregados
        error:
          type: integer
          description: Correos que no salieron
    Error:
      type: object
      required: [ok, codigo, error]
      properties:
        ok:
          type: boolean
          const: false
        codigo:
          type: string
          enum:
            - metodo_no_permitido
            - servicio_no_disponible
            - apikey_invalida
            - destinatarios_invalidos
            - destinatario_no_permitido
            - cuota_excedida
            - falta_archivo
            - archivo_vacio
            - archivo_muy_grande
            - archivo_incompleto
            - archivo_ilegible
            - formato_no_soportado
            - xlsx_invalido
            - xlsx_con_macros
            - limite_cargas
            - csv_ilegible
            - csv_ya_comprimido
            - csv_binario
            - csv_vacio
            - csv_columnas_inconsistentes
            - csv_demasiadas_columnas
            - error_interno
        error:
          type: string
          description: Mensaje legible; puede cambiar entre versiones
        reintentar_en:
          type: integer
          description: Segundos de espera (solo en `limite_cargas`)
