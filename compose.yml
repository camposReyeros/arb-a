services:
  app-arb-a:
    build: ./docker/app
    container_name: app-arb-a
    restart: unless-stopped
    env_file: .env
    environment:
      ARB_A_DSN: "pgsql:host=db-arb-a;port=5432;dbname=arb_a"
    volumes:
      # En desarrollo (repo) el código está en la raíz: ARB_A_APP_DIR=.
      # En producción (/opt/arb-a) se rsyncea a app/: ARB_A_APP_DIR=./app.
      - ${ARB_A_APP_DIR:-.}:/var/www/arb-a
      - ${ARB_A_APP_DIR:-.}/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./archivos:/var/lib/arb-a/archivos
    networks:
      - arb-a
      - redweb
    depends_on:
      db-arb-a:
        condition: service_healthy

  db-arb-a:
    image: postgres:16-alpine
    container_name: db-arb-a
    restart: unless-stopped
    environment:
      POSTGRES_DB: arb_a
      POSTGRES_USER: ${ARB_A_DB_USER}
      POSTGRES_PASSWORD: ${ARB_A_DB_PASS}
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ${ARB_A_APP_DIR:-.}/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - arb-a
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARB_A_DB_USER} -d arb_a"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  arb-a:
  redweb:
    external: true
